<!DOCTYPE html>

<div class="page-default" style="display: flex; flex-direction: column; gap: 20px; overflow-y: auto; overflow-x: hidden;">
  <!-- control template -->
  <div class="outline bg-surface" style="display: flex; height: calc(100vh - 80px - 40px - 60px); width: 100%; border-radius: 12px; overflow: hidden; padding: 30px; align-items: center; justify-content: center; gap: 40px;">
    <form action="post" style="gap: 40px; display: flex; flex-direction: column;">

      <div style="margin-bottom: 60px; width: 60%;">
        <h1 >Get in touch with us</h1>
        <!-- <p>Need help with anything? Send us a message and we'll get back to you as soon as possible.</p> -->
      </div>

      <div style="display: flex; gap: 40px;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <label for="firstname" style="font-size: medium; font-weight: bold;">Firstname</label>
          <input type="text" id="firstname" name="firstname" placeholder="Enter firstname" class="text-color search-box" style="height: 45px;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <label for="lastname" style="font-size: medium; font-weight: bold;">Lastname</label>
          <input type="text" id="lastname" name="lastname" placeholder="Enter lastname" class="text-color search-box" style="height: 45px;">
        </div>  
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <label for="email" style="font-size: medium; font-weight: bold;">Email</label>
        <input type="email" id="email" name="email" placeholder="email@example.com" class="text-color search-box" style="width: 100%; height: 45px;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <label for="message" style="font-size: medium; font-weight: bold;">Message</label>
        <textarea id="message" name="message" placeholder="Your message..." class="text-color contact-us-textarea"></textarea>
      </div>  

      <a type="submit" class="bg-primary-container contact-us-send-button">Send Message</a>
    </form>

    <div class="outline" style="width: 40%; height: 100%; border-radius: 12px; display: flex; flex-direction: column; gap: 20px; padding: 30px; background-color: var(--surface-container-highest);">
      <h2>Contact Information</h2>
      <p>If you have any questions or need assistance, feel free to reach out to us through the following contact information:</p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="material-symbols-outlined">email</span>
          <span> <strong>support@degreez.io</strong></span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="material-symbols-outlined">phone</span>
          <span><strong>+1 (123) 456-7890 </strong></span>
        </div>
      </div>

      <div  style="display: flex; flex-direction: column; gap: 10px; margin-top: 50px;">
        <h3 style="margin-bottom: 20px;">Follow Us</h3>
        <div style="display: flex; gap: 30px; font-size: 42px;">
          <a href="https://facebook.com" target="_blank" class="text-color" style="display: flex; align-items: center; gap: 5px; ">
            <wa-icon name="square-facebook" family="brands"></wa-icon>
          </a>
          <a href="https://twitter.com" target="_blank" class="text-color" style="display: flex; align-items: center; gap: 5px;">
            <wa-icon name="square-x-twitter" family="brands"></wa-icon>
          </a>
          <a href="https://instagram.com" target="_blank" class="text-color" style="display: flex; align-items: center; gap: 5px;">
            <wa-icon name="square-instagram" family="brands"></wa-icon>
          </a>
        </div>
      </div>

    </div>
  </div>  
</div>
